name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支的旧流水线跑完也没意义，直接取消，省 runner 时间
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # README 声明支持 3.11 | 3.12，两档都验，避免只在单版本上通过
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run offline test suite
        # 测试全程 0 网络调用：这里给占位值只是为了让读取 env 的模块拿到非空字符串，
        # 不代表 CI 会真的请求高德或任何 LLM 端点。
        env:
          AMAP_API_KEY: ci-placeholder
          OPENAI_API_KEY: ci-placeholder
          SEMANTIC_MEMORY_ENABLED: "0"
        run: python -m pytest -q tests
