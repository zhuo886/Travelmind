  <line x1="932" y1="119" x2="961" y2="119" stroke="#1F2937" stroke-width="1.4" marker-end="url(#arrow)" />

  <rect x="964" y="102" width="102" height="34" rx="7" fill="#F3F4F6" stroke="#1F2937" stroke-width="1.4" />
  <text x="1015" y="123" class="t-sans node-title">返回待补充</text>

